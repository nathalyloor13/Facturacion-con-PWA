<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Facturación Jennifer</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <meta name="theme-color" content="#1976d2" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/879/879859.png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.error('Error SW:', err));
      });
    }
  </script>
</head>
<body>
  <div class="contenedor-principal">
    
    <!-- Menú lateral -->
    <aside class="contenedor-aside">
      <h2 class="titulo-menu">Menú</h2>
      <nav class="menu-navegacion">
        <ul>
          <li><a href="#" data-seccion="clientes">Clientes</a></li>
          <li><a href="#" data-seccion="productos">Productos</a></li>
          <li><a href="#" data-seccion="facturacion">Facturación</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Panel dinámico (contenido que aparece al lado del menú) -->
    <div class="contenedor-panel-dinamico">
      <div id="panel-dinamico" class="panel-dinamico">
        <p>Selecciona una opción del menú </p>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script type="module" src="./javascript/navegacion.js"></script>
  <script type="module" src="./javascript/main/clientesMain.js"></script>
  <script type="module" src="./javascript/main/productosMain.js"></script>
</body>
</html>
